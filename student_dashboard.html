<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h2>Available Books</h2>

<ul>
    {% for book in books %}
        <li>{{ book[1] }} - {{ book[2] }}</li>
    {% endfor %}
</ul>

<h3>Search Book</h3>

<form method="POST" action="/search">

    <input type="text" name="book_name">
    <button type="submit">Search</button>

</form>

</body>
</html>
